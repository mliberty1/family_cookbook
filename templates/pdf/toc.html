<section class="toc-page">
    <h1>Table of Contents</h1>

    {% for category, recipes in cookbook_data.items() %}
        <div class="toc-section">
            <h2>{{ category }}</h2>
            <ul>
                {% for recipe_data in recipes %}
                    <li>
                        <a href="#recipe-{{ recipe_data.recipe.slug }}" class="toc-link">
                            <span class="recipe-name">{{ recipe_data.recipe.name }}</span>
                        </a>
                    </li>
                {% endfor %}
            </ul>
        </div>
    {% endfor %}
</section>
