<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Cookbook</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="recipe-index">

<h1>Family Cookbook</h1>
<p class="subtitle">{{ recipe_count }} cherished family recipes | <a href="search.html">Search & Browse</a></p>

{% for category, recipes in recipes_by_category.items() %}
<div class="category-accordion">
    <h2 class="category-header" data-category="{{ category }}">
        <span class="accordion-icon">▶</span> {{ category }} ({{ recipes|length }})
    </h2>
    <div class="category-content" style="display: none;">
        <ul class="recipe-list">
        {% for recipe in recipes %}
            <li><a href="{{ recipe.filename }}">{{ recipe.name }}</a></li>
        {% endfor %}
        </ul>
    </div>
</div>
{% endfor %}

<script>
// Accordion functionality
document.querySelectorAll('.category-header').forEach(header => {
    header.addEventListener('click', function() {
        const content = this.nextElementSibling;
        const icon = this.querySelector('.accordion-icon');

        if (content.style.display === 'none') {
            content.style.display = 'block';
            icon.textContent = '▼';
        } else {
            content.style.display = 'none';
            icon.textContent = '▶';
        }
    });

    // Make headers keyboard accessible
    header.setAttribute('role', 'button');
    header.setAttribute('tabindex', '0');
    header.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
        }
    });
});
</script>

</body>

</html>
